{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布帖子</title>
    <link rel="stylesheet" href="{% static 'css/registered.css' %}">
</head>
<body class="post-form-page">
    <div class="topbar">
        <div class="brand">发布帖子</div>
        <div class="nav-actions">
            <a class="nav-btn nav-btn-back" href="{% url 'post' %}">返回广场</a>
        </div>
    </div>

    <div class="page">
        <div class="form-box">
            <h1 class="form-title">新建帖子</h1>
            <form action="{% url 'push' %}" method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" id="title" name="title" maxlength="100" placeholder="请输入帖子标题" required>
                </div>
                <div class="form-group">
                    <label for="content">内容</label>
                    <textarea id="content" name="content" placeholder="请输入帖子内容" required></textarea>
                </div>
                {% if err %}
                    <div class="err">{{ err }}</div>
                {% endif %}
                <button class="btn-submit" type="submit">发布帖子</button>
            </form>
        </div>
    </div>
</body>
</html>
