<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    {% for a in list %}

    {% if  forloop.first %}
    <hr color="red"><br><span>OK</span>
    {% endif %}

    {% if score > 60 %}
    <p>{{forloop.counter}}:{{a}}</p>
    {% else %}

    {% if  forloop.first %}
    <hr color="red"><br><span>NOT OK</span>
    {% endif %}

    <p>{{forloop.counter}}:{{a}}</p>
    {% endif %}

    {% empty %}
	<h3>传入的对象为空</h3>
    {% endfor %}

</body>

</html>
